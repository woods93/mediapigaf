name = "mlc-lookup-test"
main = "worker.js"
compatibility_date = "2026-11-01"

# .sql and .html files are bundled as plain text (the migration and the two pages)
[[rules]]
type = "Text"
globs = ["**/*.sql", "**/*.html"]
fallthrough = true

[vars]
DEMO = "1"   # applies to the MLC source only; set to "0" once MLC_USER and MLC_PASS secrets exist
ACCESS_TEAM_DOMAIN = "gentle-haze-fb19.cloudflareaccess.com"
ACCESS_AUD = "9535a71a6fd98c8e6cedb27dd5fa72d3eb25d0bd0ea303da506a4eda9ae8f3fa"

# Song metadata. The database already exists (Cloudflare created it during the first deploy attempt), so its id is pinned here.
[[d1_databases]]
binding = "DB"
database_name = "mediapigaf-uploads"
database_id = "ed10603b-adbf-43d6-a27c-990513706ad2"

# Uploaded files (proofs, masters). Private bucket, created in the dashboard (Cloudflare does not auto-create R2).
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "mediapigaf-uploads"
