<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact | Media Pig AF</title>
<meta name="description" content="Contact Media Pig AF.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" href="img/favicon.png" type="image/png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<a class="skip" href="#content">Skip to content</a>
<header class="top">
  <a class="logo" href="index.html" aria-label="Media Pig AF home"><img src="img/logo.png" alt="Media Pig AF" height="64"></a>
  <nav aria-label="Main"><ul><li><a href="index.html">Home</a></li><li><a href="about.html">About</a></li><li><a href="contact.html" aria-current="page">Contact</a></li></ul></nav>
</header>
<main id="content">
<section class="page">
  <h1>Contact us</h1>
  <p>Questions about production, artist development, or licensing? Send a message.</p>
  
  <form id="contact-form" action="https://api.web3forms.com/submit" method="POST" data-key="">
    <input type="hidden" name="access_key" value="">
    <input type="hidden" name="subject" value="New message from the Media Pig AF website">
    <input type="hidden" name="from_name" value="Media Pig AF website">
    <input type="checkbox" name="botcheck" class="hp" tabindex="-1" autocomplete="off" style="display:none">
    <div class="row">
      <label>First name<input name="first_name" required autocomplete="given-name"></label>
      <label>Last name<input name="last_name" autocomplete="family-name"></label>
    </div>
    <label>Email<input type="email" name="email" required autocomplete="email"></label>
    <label>Write a message<textarea name="message" rows="6" required></textarea></label>
    <button class="btn" type="submit">Send</button>
    <p class="form-status" role="status" aria-live="polite"></p>
  </form>
</section>
</main>
<footer class="foot">
  <p>Founded in Nashville, Tennessee &copy; 2026 Media Pig AF</p>
</footer>
<script src="js/site.js"></script>
</body>
</html>
